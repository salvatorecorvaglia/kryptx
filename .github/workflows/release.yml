name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          which jq openssl zip >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq openssl coreutils zip)

      - name: Run unit test suite
        run: |
          chmod +x test_kryptx.sh kryptx.sh
          ./test_kryptx.sh

      - name: Extract Changelog & Set Release Info
        id: release_info
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" == "" || "${TAG_NAME}" == "main" || "${TAG_NAME}" == "master" ]]; then
            TAG_NAME="v0.0.0-dev"
          fi

          echo "title=Kryptx ${TAG_NAME}" >> $GITHUB_OUTPUT

          python3 - << 'EOF'
          import os, re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          ver = tag.lstrip("v")

          changelog_file = "CHANGELOG.md"
          if not os.path.exists(changelog_file):
              exit(0)

          with open(changelog_file, "r", encoding="utf-8") as f:
              lines = f.readlines()

          in_section = False
          extracted_lines = []

          for line in lines:
              if line.startswith("## "):
                  if in_section:
                      break
                  if re.search(r"\[" + re.escape(ver) + r"\]", line) or re.search(r"\[" + re.escape(tag) + r"\]", line):
                      in_section = True
                      continue
              elif in_section:
                  extracted_lines.append(line)

          notes = "".join(extracted_lines).strip()
          if notes:
              with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
                  f.write(notes + "\n")
              print("Extracted release notes successfully.")
          EOF

          if [[ -f RELEASE_NOTES.md && -s RELEASE_NOTES.md ]]; then
            echo "body_path=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          fi

      - name: Package Release Assets
        id: package
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" == "" || "${TAG_NAME}" == "main" || "${TAG_NAME}" == "master" ]]; then
            TAG_NAME="v0.0.0-dev"
          fi

          ARCHIVE_NAME="kryptx-${TAG_NAME}"
          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          # Copy project artifacts
          cp kryptx.sh "${DIST_DIR}/kryptx"
          cp LICENSE README.md SECURITY.md "${DIST_DIR}/"
          chmod +x "${DIST_DIR}/kryptx"

          # Create compressed archives (flat structure for both tar and zip)
          tar -czvf "${ARCHIVE_NAME}.tar.gz" -C "${DIST_DIR}" .
          (cd "${DIST_DIR}" && zip -r "../${ARCHIVE_NAME}.zip" .)

          # Standalone executable file for direct download
          cp kryptx.sh "kryptx"
          chmod +x "kryptx"

          # Generate SHA256 checksums file
          sha256sum "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}.zip" "kryptx" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_info.outputs.title }}
          body_path: ${{ steps.release_info.outputs.body_path }}
          files: |
            kryptx-*.tar.gz
            kryptx-*.zip
            kryptx
            checksums.txt
          generate_release_notes: ${{ steps.release_info.outputs.body_path == '' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}


